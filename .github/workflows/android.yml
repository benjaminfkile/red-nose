# docs/red-nose.md section 16.
name: android

# Pushes to dev and main and a manual run only, never pull_request: the job
# runs on a self-hosted runner, and a pull request from a fork must not be
# able to start it (docs/red-nose.md 16).
on:
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # The self-hosted runner nimbus (labels self-hosted,linux,x64,nimbus); see docs/red-nose.md 16.
    runs-on: [self-hosted, linux, x64, nimbus]
    # The environment holds the signing key of its flavour and admits its branch only.
    environment: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
    steps:
      - uses: actions/checkout@v4
      - name: Free runner disk space
        # Only on a GitHub-hosted runner (about 14 GB free, which the native build
        # exhausts): drop toolchains this workflow never uses. Never on a self-hosted
        # box, where these directories belong to the machine.
        if: runner.environment == 'github-hosted'
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/.ghcup /opt/ghc /usr/local/share/boost \
            /usr/share/swift /usr/local/share/powershell /opt/hostedtoolcache/CodeQL \
            /usr/local/lib/node_modules /usr/local/julia* /opt/az
          sudo docker image prune -af >/dev/null 2>&1 || true
          df -h / | tail -1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: npm ci
      - name: Check vendored contracts against CONTRACTS_SHA
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run contracts:check
      - run: npm test
      - run: npx tsc --noEmit
      - name: Unit tests (dev debug)
        run: cd android && ./gradlew :app:testDevDebugUnitTest --no-daemon
      - name: Write the signing keystore
        env:
          REDNOSE_KEYSTORE_B64: ${{ secrets.REDNOSE_KEYSTORE_B64 }}
        run: |
          umask 077
          printf '%s' "$REDNOSE_KEYSTORE_B64" | base64 -d >"$RUNNER_TEMP/rednose-release.p12"
          test -s "$RUNNER_TEMP/rednose-release.p12"
      - name: Assemble
        id: assemble
        env:
          REDNOSE_KEYSTORE_FILE: ${{ runner.temp }}/rednose-release.p12
          REDNOSE_KEYSTORE_PASSWORD: ${{ secrets.REDNOSE_KEYSTORE_PASSWORD }}
          REDNOSE_KEY_ALIAS: ${{ secrets.REDNOSE_KEY_ALIAS }}
          REDNOSE_KEY_PASSWORD: ${{ secrets.REDNOSE_KEY_PASSWORD }}
        run: |
          cd android
          # The beacon phone is arm64 only (docs/red-nose.md 14.4); building the
          # other three ABIs quadruples the native build time and disk use.
          ABIS=-PreactNativeArchitectures=arm64-v8a
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            ./gradlew :app:assembleProdRelease --no-daemon "$ABIS"
            echo "flavour=prod" >>"$GITHUB_OUTPUT"
          else
            ./gradlew :app:assembleDevRelease --no-daemon "$ABIS"
            echo "flavour=dev" >>"$GITHUB_OUTPUT"
          fi
      - name: Remove the signing keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/rednose-release.p12"
      - name: Locate signed APK
        id: apk
        run: |
          flavour="${{ steps.assemble.outputs.flavour }}"
          apk="$(find android/app/build/outputs/apk/"$flavour"/release -name '*.apk' -print -quit)"
          if [ -z "$apk" ]; then
            echo "no APK produced under android/app/build/outputs/apk/$flavour/release" >&2
            exit 1
          fi
          echo "path=$apk" >>"$GITHUB_OUTPUT"
      - name: Package Magisk module
        id: module
        run: |
          flavour="${{ steps.assemble.outputs.flavour }}"
          version="$(cat VERSION)"
          apk="${{ steps.apk.outputs.path }}"
          stage="$(mktemp -d)"
          cp -R provisioning/magisk-module/. "$stage"/
          mkdir -p "$stage/system/app/RedNose"
          # Drop the placeholder .gitkeep from the packaged zip and land the signed APK.
          rm -f "$stage/system/app/RedNose/.gitkeep"
          cp "$apk" "$stage/system/app/RedNose/RedNose.apk"
          out="$PWD/red-nose-${flavour}-${version}-${GITHUB_SHA}.magisk.zip"
          (cd "$stage" && zip -r "$out" .)
          echo "path=$out" >>"$GITHUB_OUTPUT"
          # Rename the APK to match the module zip's naming scheme.
          apk_out="$PWD/red-nose-${flavour}-${version}-${GITHUB_SHA}.apk"
          cp "$apk" "$apk_out"
          echo "apk_out=$apk_out" >>"$GITHUB_OUTPUT"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: red-nose-${{ steps.assemble.outputs.flavour }}-${{ github.ref_name }}-${{ github.sha }}-apk
          path: ${{ steps.module.outputs.apk_out }}
      - name: Upload Magisk module
        uses: actions/upload-artifact@v4
        with:
          name: red-nose-${{ steps.assemble.outputs.flavour }}-${{ github.ref_name }}-${{ github.sha }}-magisk
          path: ${{ steps.module.outputs.path }}
